<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Proyecto Night X</title>
<style>
  :root { --cyan: #00f0ff; --pink: #ff2d95; --bg: #08080e; --text-muted: #9a9aab; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: #fff; min-height: 100vh; padding: 1.5rem 1rem 4rem; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; }
  .login-card { max-width: 340px; margin: 4rem auto; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; text-align: center; }
  input { width: 100%; padding: 0.8rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.3); color: #fff; font-size: 0.95rem; margin-top: 0.8rem; }
  button { padding: 0.7rem 1.2rem; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #000; width: 100%; margin-top: 0.8rem; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab { padding: 0.5rem 1rem; border-radius: 20px; background: rgba(255,255,255,0.06); font-size: 0.82rem; cursor: pointer; border: 1px solid transparent; }
  .tab.active { border-color: var(--cyan); color: var(--cyan); }
  .pedido-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1.1rem; margin-bottom: 0.9rem; }
  .pedido-top { display: flex; justify-content: space-between; align-items: start; gap: 0.5rem; }
  .pedido-nombre { font-weight: 700; font-size: 1rem; }
  .pedido-meta { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.2rem; }
  .estado-badge { padding: 0.22rem 0.6rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
  .estado-badge.pendiente { background: rgba(255,200,0,0.15); color: #ffc800; }
  .estado-badge.aprobado { background: rgba(0,255,150,0.15); color: #00ff96; }
  .estado-badge.rechazado { background: rgba(255,45,95,0.15); color: #ff2d5f; }
  .comprobante-img { max-width: 100%; border-radius: 10px; margin-top: 0.7rem; cursor: zoom-in; }
  .acciones { display: flex; gap: 0.6rem; margin-top: 0.9rem; }
  .btn-aprobar { flex: 1; background: linear-gradient(135deg, #00ff96, #00c4d4); color: #000; }
  .btn-rechazar { flex: 1; background: rgba(255,45,95,0.15); color: #ff2d5f; border: 1px solid rgba(255,45,95,0.4); }
  .contacto-info { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.4rem; }
  .contacto-info b { color: #fff; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 999; padding: 1rem; }
  #overlay img { max-width: 100%; max-height: 90vh; border-radius: 10px; }
  .empty { color: var(--text-muted); text-align: center; padding: 2rem; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="loginScreen" class="login-card">
  <h1 style="font-size:1.2rem;">Panel Admin</h1>
  <p style="color:var(--text-muted); font-size:0.85rem;">Ingresa la clave de administrador</p>
  <input type="password" id="claveInput" placeholder="Clave admin">
  <button class="btn-primary" id="btnLogin">Entrar</button>
  <div id="loginError" style="color:#ff2d5f; font-size:0.8rem; margin-top:0.6rem;"></div>
</div>

<div class="wrap" id="panelScreen" style="display:none;">
  <h1>Pedidos - Proyecto Night X</h1>
  <div class="tabs">
    <div class="tab active" data-filtro="pendiente">Pendientes</div>
    <div class="tab" data-filtro="aprobado">Aprobados</div>
    <div class="tab" data-filtro="rechazado">Rechazados</div>
    <div class="tab" data-filtro="todos">Todos</div>
  </div>
  <div id="lista"></div>
</div>

<div id="overlay" onclick="this.style.display='none'"><img id="overlayImg"></div>

<script>
  const SUPABASE_URL = "https://vkduxheifqmomtazolku.supabase.co";
  let ADMIN_SECRET = sessionStorage.getItem('nx_admin_secret') || '';
  let pedidosCache = [];
  let filtroActual = 'pendiente';

  if (ADMIN_SECRET) mostrarPanel();

  document.getElementById('btnLogin').addEventListener('click', async () => {
    const clave = document.getElementById('claveInput').value;
    ADMIN_SECRET = clave;
    const ok = await cargarPedidos();
    if (ok) {
      sessionStorage.setItem('nx_admin_secret', clave);
      mostrarPanel();
    } else {
      document.getElementById('loginError').textContent = 'Clave incorrecta.';
    }
  });

  function mostrarPanel() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('panelScreen').style.display = 'block';
    cargarPedidos();
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      filtroActual = tab.dataset.filtro;
      render();
    });
  });

  async function cargarPedidos() {
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-pedidos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET },
        body: JSON.stringify({ accion: 'listar' })
      });
      if (res.status === 401) return false;
      const data = await res.json();
      pedidosCache = data.pedidos || [];
      render();
      return true;
    } catch (err) {
      return false;
    }
  }

  function render() {
    const lista = document.getElementById('lista');
    const filtrados = filtroActual === 'todos' ? pedidosCache : pedidosCache.filter(p => p.estado_pago === filtroActual);
    if (!filtrados.length) {
      lista.innerHTML = '<div class="empty">No hay pedidos en esta categoría.</div>';
      return;
    }
    lista.innerHTML = filtrados.map(p => `
      <div class="pedido-card">
        <div class="pedido-top">
          <div>
            <div class="pedido-nombre">${p.nombre_comprador}</div>
            <div class="pedido-meta">${p.tipos_entrada?.nombre || ''} · ${p.cantidad} entrada(s) · $${p.precio_total.toLocaleString('es-CO')}</div>
            <div class="pedido-meta">${new Date(p.created_at).toLocaleString('es-CO')} · ${p.metodo_pago || ''}</div>
          </div>
          <span class="estado-badge ${p.estado_pago}">${p.estado_pago}</span>
        </div>
        <div class="contacto-info">
          📧 <b>${p.email_comprador}</b> &nbsp; 📱 <b>${p.telefono_comprador}</b>
        </div>
        ${p.comprobante_url ? `<img src="${p.comprobante_url}" class="comprobante-img" onclick="verImagen('${p.comprobante_url}')">` : ''}
        ${p.estado_pago === 'pendiente' ? `
          <div class="acciones">
            <button class="btn-aprobar" onclick="aprobar('${p.id}')">✅ Aprobar y generar ticket</button>
            <button class="btn-rechazar" onclick="rechazar('${p.id}')">❌ Rechazar</button>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  function verImagen(url) {
    document.getElementById('overlayImg').src = url;
    document.getElementById('overlay').style.display = 'flex';
  }

  async function aprobar(pedidoId) {
    if (!confirm('¿Confirmas que el pago se ve correcto? Se generará el ticket con QR.')) return;
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-pedidos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET },
      body: JSON.stringify({ accion: 'aprobar', pedido_id: pedidoId })
    });
    const data = await res.json();
    if (!res.ok) { alert('Error: ' + data.error); return; }
    alert('✅ Ticket generado. Ahora ve a "Mi Ticket" con el correo del comprador para copiar el código QR y enviárselo por WhatsApp, o dile que entre a mi-ticket.html con su correo.');
    cargarPedidos();
  }

  async function rechazar(pedidoId) {
    const motivo = prompt('¿Por qué rechazas este pedido? (opcional)');
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-pedidos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET },
      body: JSON.stringify({ accion: 'rechazar', pedido_id: pedidoId, notas_admin: motivo })
    });
    if (!res.ok) { alert('Error al rechazar.'); return; }
    cargarPedidos();
  }
</script>
</body>
</html>
