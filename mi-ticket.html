<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Ticket | Proyecto Night X</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --cyan: #00f0ff; --pink: #ff2d95; --bg: #08080e; --text-muted: #9a9aab; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: #fff;
    min-height: 100vh; padding: 2rem 1rem 4rem;
    background-image: radial-gradient(circle at 20% 10%, rgba(168,85,247,0.12), transparent 40%),
                       radial-gradient(circle at 80% 80%, rgba(0,240,255,0.1), transparent 40%);
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .back-link { display: inline-block; color: var(--cyan); text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.3rem; }
  p.subtitle { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; }
  input { width: 100%; padding: 0.8rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.3); color: #fff; font-size: 0.95rem; }
  button { width: 100%; padding: 0.9rem; margin-top: 0.8rem; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #000; font-weight: 700; cursor: pointer; }
  .estado { display: inline-block; padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.72rem; font-weight: 700; margin-bottom: 0.6rem; }
  .estado.pendiente { background: rgba(255,200,0,0.15); color: #ffc800; }
  .estado.aprobado { background: rgba(0,255,150,0.15); color: #00ff96; }
  .estado.rechazado { background: rgba(255,45,95,0.15); color: #ff2d5f; }
  .ticket-qr { display: flex; flex-direction: column; align-items: center; padding: 1rem; background: #fff; border-radius: 12px; margin: 0.6rem 0; }
  .ticket-qr .codigo { color: #000; font-family: monospace; font-size: 0.8rem; margin-top: 0.5rem; letter-spacing: 1px; }
  .ticket-usado-badge { color: var(--pink); font-size: 0.78rem; font-weight: 700; margin-top: 0.3rem; }
  .msg { margin-top: 1rem; padding: 0.9rem; border-radius: 10px; font-size: 0.88rem; display:none; }
  .msg.error { background: rgba(255,45,95,0.12); border: 1px solid rgba(255,45,95,0.4); display: block; }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back-link">&larr; Volver al inicio</a>
  <h1>Mi Ticket</h1>
  <p class="subtitle">Ingresa el correo con el que compraste tu entrada para ver el estado y tu código QR.</p>

  <div class="card">
    <input type="email" id="email" placeholder="tucorreo@ejemplo.com">
    <button id="btnBuscar">Buscar mi ticket</button>
  </div>

  <div class="msg" id="msgBox"></div>
  <div id="resultados"></div>
</div>

<script>
  const SUPABASE_URL = "https://vkduxheifqmomtazolku.supabase.co";
  const ANON_KEY = "sb_publishable_0qxowk5wAIYyUvfMzK6qCg_YQATb8uT";

  document.getElementById('btnBuscar').addEventListener('click', buscar);
  document.getElementById('email').addEventListener('keypress', (e) => { if (e.key === 'Enter') buscar(); });

  async function buscar() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const msg = document.getElementById('msgBox');
    const cont = document.getElementById('resultados');
    cont.innerHTML = '';
    msg.style.display = 'none';
    if (!email) return;

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/mi-ticket`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No se encontraron pedidos.');

      data.pedidos.forEach(p => {
        const div = document.createElement('div');
        div.className = 'card';
        const estadoTexto = { pendiente: 'Pago en revisión', aprobado: 'Pago aprobado', rechazado: 'Pago rechazado' }[p.estado_pago];
        let html = `<span class="estado ${p.estado_pago}">${estadoTexto}</span>
          <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.5rem;">
            ${p.tipos_entrada?.nombre || ''} · ${p.cantidad} entrada(s) · ${p.nombre_comprador}
          </div>`;

        if (p.estado_pago === 'aprobado' && p.tickets.length) {
          p.tickets.forEach((t, i) => {
            html += `<div class="ticket-qr">
              <div id="qr-${p.id}-${i}"></div>
              <div class="codigo">${t.codigo_qr}</div>
              ${t.usado ? '<div class="ticket-usado-badge">⚠️ Ya usado en la entrada</div>' : ''}
            </div>`;
          });
        } else if (p.estado_pago === 'pendiente') {
          html += `<div style="font-size:0.85rem; color:var(--text-muted);">Estamos verificando tu comprobante. Te avisaremos apenas se apruebe.</div>`;
        } else if (p.estado_pago === 'rechazado') {
          html += `<div style="font-size:0.85rem; color:var(--text-muted);">No pudimos validar tu pago. Contáctanos por WhatsApp.</div>`;
        }

        div.innerHTML = html;
        cont.appendChild(div);

        if (p.estado_pago === 'aprobado') {
          p.tickets.forEach((t, i) => {
            new QRCode(document.getElementById(`qr-${p.id}-${i}`), {
              text: t.codigo_qr,
              width: 180,
              height: 180
            });
          });
        }
      });
    } catch (err) {
      msg.textContent = '❌ ' + err.message;
      msg.className = 'msg error';
    }
  }
</script>
</body>
</html>
